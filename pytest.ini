[pytest]
testpaths = tests
addopts = -ra
markers =
    llm: live LLM-as-a-judge evaluations (requires DeepEval, Groq SDK and provider credentials)
    ui: browser-based Playwright tests (requires the app server and Chromium)
    mobile: native Android automation tests (requires Appium server, UiAutomator2 and Android device/emulator)
