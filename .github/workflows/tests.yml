name: Northstar AI Quality Suite

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  deterministic-and-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Start application
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health; then exit 0; fi
            sleep 1
          done
          cat server.log
          exit 1
      - name: Run deterministic tests and Playwright
        run: pytest -m "not llm and not mobile" -v
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: northstar-test-reports
          path: reports/
